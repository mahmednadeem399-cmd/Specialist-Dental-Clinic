<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specialist Dental Clinic — Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4zUTk7pkWwzIdCKl-tV_Hyjep62ZCBHQ",
    authDomain: "appointment-setter-773a2.firebaseapp.com",
    projectId: "appointment-setter-773a2",
    storageBucket: "appointment-setter-773a2.firebasestorage.app",
    messagingSenderId: "475750672378",
    appId: "1:475750672378:web:f6a35b7f3d0d9196b4a643",
    measurementId: "G-JREZBRBZL7"
  };

  const app = initializeApp(firebaseConfig);
  window.firebaseAdmin = {
    auth: getAuth(app),
    db: getFirestore(app),
    signInWithEmailAndPassword, onAuthStateChanged, signOut,
    collection, onSnapshot, doc, updateDoc, deleteDoc
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  :root {
    --porcelain: #FBFAF7; --panel: #FFFFFF; --sage-deep: #33544A; --sage-mid: #6E8F82;
    --sage-pale: #E4ECE7; --ink: #23302A; --ink-soft: #5B6B63; --line: #DDE5DF;
    --error: #A6432F; --radius-s: 6px; --radius-m: 12px;
    --shadow: 0 1px 2px rgba(35,48,42,0.06), 0 8px 24px rgba(35,48,42,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--porcelain); color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 26px;
    color: var(--sage-deep); margin: 0 0 4px;
  }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 28px; }

  /* Login */
  #loginBox {
    max-width: 360px; margin: 60px auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-m);
    padding: 28px; box-shadow: var(--shadow);
  }
  #loginBox h2 {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px;
    color: var(--sage-deep); margin: 0 0 18px; text-align: center;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%; border: 1px solid var(--line); background: var(--porcelain);
    border-radius: var(--radius-s); padding: 11px 12px; font-family: inherit; font-size: 14.5px;
  }
  .btn {
    width: 100%; background: var(--sage-deep); color: var(--porcelain); border: none;
    border-radius: var(--radius-s); padding: 13px; font-family: inherit; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .loginError { color: var(--error); font-size: 13px; margin-top: 10px; text-align: center; min-height: 16px; }

  /* Dashboard */
  #dashboard { display: none; }
  #dashboard.visible { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .signout {
    background: none; border: 1px solid var(--line); border-radius: var(--radius-s);
    padding: 8px 14px; font-family: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .filter-chip.selected { background: var(--sage-deep); border-color: var(--sage-deep); color: var(--porcelain); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: var(--radius-m); overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  th { background: var(--sage-pale); color: var(--sage-deep); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.02em; }
  tr:last-child td { border-bottom: none; }
  .muted { color: var(--ink-soft); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  a.tel, a.mail { color: var(--sage-deep); text-decoration: none; }
  a.tel:hover, a.mail:hover { text-decoration: underline; }

  /* Responsive appointment cards */
  .mobile-appointments { display: none; }

  @media (max-width: 700px) {
    .wrap { max-width: 100%; padding: 18px 14px 36px; }
    .topbar { align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    h1 { font-size: 24px; }
    .sub { margin-bottom: 0; }
    .signout { flex: 0 0 auto; padding: 8px 11px; }
    .toolbar {
      gap: 7px; margin: 0 -2px 14px; overflow-x: auto;
      flex-wrap: nowrap; padding: 2px 2px 7px; scrollbar-width: thin;
    }
    .filter-chip { flex: 0 0 auto; white-space: nowrap; padding: 8px 12px; }

    #apptTable { display: none; }

    .mobile-appointments { display: grid; gap: 12px; }

    .appointment-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius-m); box-shadow: var(--shadow); overflow: hidden;
    }
    .appointment-card__top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 15px; background: var(--sage-pale);
      border-bottom: 1px solid var(--line);
    }
    .appointment-date, .appointment-time {
      color: var(--sage-deep); font-weight: 700; font-size: 14px;
    }
    .appointment-time { white-space: nowrap; }
    .appointment-card__body { padding: 15px; display: grid; gap: 13px; }
    .appointment-field { min-width: 0; }
    .appointment-label {
      display: block; color: var(--ink-soft); font-size: 11px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      margin-bottom: 3px;
    }
    .appointment-value {
      color: var(--ink); font-size: 14px; overflow-wrap: anywhere;
    }
    .appointment-value a { color: var(--sage-deep); text-decoration: none; }
    .appointment-value a:hover { text-decoration: underline; }
    .appointment-notes { padding-top: 12px; border-top: 1px solid var(--line); }

    .appointment-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .appointment-action {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: var(--radius-s);
      padding: 8px 11px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .appointment-action.cancel {
      color: var(--error);
      border-color: #E7C7C0;
    }
    .appointment-action.delete {
      color: #fff;
      background: var(--error);
      border-color: var(--error);
    }

    #loginBox { margin: 35px auto; width: 100%; max-width: 380px; padding: 23px; }
  }

  @media (min-width: 701px) {
    .mobile-appointments { display: none !important; }
  }

</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox">
    <h2>Specialist Dental Clinic</h2>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">Sign in</button>
    <div class="loginError" id="loginError"></div>
  </div>

  <div id="dashboard">
    <div class="topbar">
      <div>
        <h1>Appointments</h1>
        <p class="sub" id="countLine">Loading…</p>
      </div>
      <button class="signout" id="signoutBtn">Sign out</button>
    </div>

    <div class="toolbar" id="dayFilters"></div>

    <table id="apptTable">
      <thead>
        <tr>
          <th>Date</th><th>Time</th><th>Service</th><th>Patient</th><th>Phone</th><th>Email</th><th>Notes</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="apptBody"></tbody>
    </table>
    <div class="mobile-appointments" id="mobileAppointments"></div>
    <div class="empty-state" id="emptyState" style="display:none;">No appointments yet.</div>
  </div>

</div>

<script>
(function () {
  const loginBox = document.getElementById('loginBox');
  const dashboard = document.getElementById('dashboard');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const signoutBtn = document.getElementById('signoutBtn');
  const apptBody = document.getElementById('apptBody');
  const apptTable = document.getElementById('apptTable');
  const emptyState = document.getElementById('emptyState');
  const countLine = document.getElementById('countLine');
  const dayFilters = document.getElementById('dayFilters');
  const mobileAppointments = document.getElementById('mobileAppointments');

  let allAppts = [];
  let currentFb = null;
  let dayFilter = 'all';
  let unsub = null;
  const CALENDAR_SYNC_URL = 'https://script.google.com/macros/s/AKfycbzeKN1SdZI8LYFiFi9B1oRSkT_aBtxPa1S6v_tCcGqTeS-fo9i7H-ZYRj9MDo5Q6UP7fQ/exec';

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function formatDateLong(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function formatTime12(t) {
    const [h, m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + String(m).padStart(2, '0') + ' ' + ap;
  }

  function renderFilters() {
    const todayISO = new Date().toISOString().slice(0, 10);
    const dates = [...new Set(allAppts.map(a => a.date))].sort();
    const upcoming = dates.filter(d => d >= todayISO).slice(0, 6);
    dayFilters.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'filter-chip' + (dayFilter === 'all' ? ' selected' : '');
    allChip.textContent = 'All upcoming';
    allChip.onclick = () => { dayFilter = 'all'; render(); };
    dayFilters.appendChild(allChip);
    upcoming.forEach(d => {
      const chip = document.createElement('button');
      chip.className = 'filter-chip' + (dayFilter === d ? ' selected' : '');
      chip.textContent = formatDateLong(d);
      chip.onclick = () => { dayFilter = d; render(); };
      dayFilters.appendChild(chip);
    });
  }

  function render() {
    renderFilters();
    const todayISO = new Date().toISOString().slice(0, 10);
    let rows = allAppts.filter(a => a.date >= todayISO);
    if (dayFilter !== 'all') rows = rows.filter(a => a.date === dayFilter);
    rows.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    countLine.textContent = rows.length + (rows.length === 1 ? ' upcoming appointment' : ' upcoming appointments');

    if (!rows.length) {
      apptTable.style.display = 'none';
      mobileAppointments.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    apptTable.style.display = 'table';
    emptyState.style.display = 'none';

    apptBody.innerHTML = rows.map(a => `
      <tr>
        <td>${escapeHtml(formatDateLong(a.date))}</td>
        <td>${escapeHtml(formatTime12(a.time))}</td>
        <td>${escapeHtml(a.service)}</td>
        <td>${escapeHtml(a.patientName)}</td>
        <td><a class="tel" href="tel:${escapeHtml(a.phone)}">${escapeHtml(a.phone)}</a></td>
        <td><a class="mail" href="mailto:${escapeHtml(a.email)}">${escapeHtml(a.email)}</a></td>
        <td class="muted">${escapeHtml(a.notes || '—')}</td>
        <td>
          <button class="appointment-action cancel" onclick="cancelAppointment('${escapeHtml(a._id)}')">Cancel</button>
          <button class="appointment-action delete" onclick="deleteAppointment('${escapeHtml(a._id)}')">Delete</button>
        </td>
      </tr>
    `).join('');

    mobileAppointments.innerHTML = rows.map(a => `
      <article class="appointment-card">
        <div class="appointment-card__top">
          <span class="appointment-date">${escapeHtml(formatDateLong(a.date))}</span>
          <span class="appointment-time">${escapeHtml(formatTime12(a.time))}</span>
        </div>
        <div class="appointment-card__body">
          <div class="appointment-field">
            <span class="appointment-label">Patient</span>
            <div class="appointment-value">${escapeHtml(a.patientName)}</div>
          </div>
          <div class="appointment-field">
            <span class="appointment-label">Service</span>
            <div class="appointment-value">${escapeHtml(a.service)}</div>
          </div>
          <div class="appointment-field">
            <span class="appointment-label">Phone</span>
            <div class="appointment-value"><a href="tel:${escapeHtml(a.phone)}">${escapeHtml(a.phone)}</a></div>
          </div>
          <div class="appointment-field">
            <span class="appointment-label">Email</span>
            <div class="appointment-value"><a href="mailto:${escapeHtml(a.email)}">${escapeHtml(a.email)}</a></div>
          </div>
          <div class="appointment-field appointment-notes">
            <span class="appointment-label">Notes</span>
            <div class="appointment-value">${escapeHtml(a.notes || '—')}</div>
          </div>
          <div class="appointment-actions">
            <button class="appointment-action cancel" onclick="cancelAppointment('${escapeHtml(a._id)}')">Cancel</button>
            <button class="appointment-action delete" onclick="deleteAppointment('${escapeHtml(a._id)}')">Delete</button>
          </div>
        </div>
      </article>
    `).join('');
  }

  function startListening(fb) {
    if (unsub) { unsub(); unsub = null; }
    currentFb = fb;
    unsub = fb.onSnapshot(fb.collection(fb.db, 'appointments'), (snap) => {
      allAppts = [];
      snap.forEach(docSnap => {
        const d = docSnap.data();
        if (d && d.status === 'booked') allAppts.push({ ...d, _id: docSnap.id });
      });
      render();
    }, (err) => {
      countLine.textContent = 'Could not load appointments — check your connection.';
    });
  }

  async function cancelAppointment(id) {
    if (!currentFb || !id) return;
    const confirmed = window.confirm('Cancel this appointment? It will no longer appear in the upcoming appointments list.');
    if (!confirmed) return;

    const appt = allAppts.find(a => a._id === id);

    try {
      await currentFb.updateDoc(currentFb.doc(currentFb.db, 'appointments', id), {
        status: 'cancelled',
        cancelledAt: new Date().toISOString()
      });
      // Appointment and availability docs share the same ID (date_time),
      // so this frees the slot back up for other patients to book.
      try { await currentFb.deleteDoc(currentFb.doc(currentFb.db, 'availability', id)); } catch (e) { /* slot may already be gone */ }
      if (appt && appt.calendarEventId) {
        fetch(CALENDAR_SYNC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', eventId: appt.calendarEventId })
        }).catch(() => { /* cancellation already saved; calendar removal failure shouldn't block it */ });
      }
    } catch (e) {
      window.alert('Could not cancel the appointment. Please check your connection and Firestore permissions.');
    }
  }

  async function deleteAppointment(id) {
    if (!currentFb || !id) return;
    const confirmed = window.confirm('Delete this appointment permanently? This cannot be undone.');
    if (!confirmed) return;

    try {
      await currentFb.deleteDoc(currentFb.doc(currentFb.db, 'appointments', id));
      try { await currentFb.deleteDoc(currentFb.doc(currentFb.db, 'availability', id)); } catch (e) { /* slot may already be gone */ }
    } catch (e) {
      window.alert('Could not delete the appointment. Please check your connection and Firestore permissions.');
    }
  }

  window.cancelAppointment = cancelAppointment;
  window.deleteAppointment = deleteAppointment;

  function wireApp(fb) {
    loginBtn.addEventListener('click', async () => {
      loginError.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in…';
      try {
        await fb.signInWithEmailAndPassword(fb.auth, emailInput.value.trim(), passwordInput.value);
      } catch (e) {
        loginError.textContent = 'Wrong email or password.';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in';
      }
    });

    passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

    signoutBtn.addEventListener('click', () => fb.signOut(fb.auth));

    fb.onAuthStateChanged(fb.auth, (user) => {
      if (user) {
        loginBox.style.display = 'none';
        dashboard.classList.add('visible');
        startListening(fb);
      } else {
        dashboard.classList.remove('visible');
        loginBox.style.display = 'block';
        if (unsub) { unsub(); unsub = null; }
        allAppts = [];
      }
    });
  }

  if (window.firebaseAdmin) {
    wireApp(window.firebaseAdmin);
  } else {
    window.addEventListener('firebase-ready', () => wireApp(window.firebaseAdmin), { once: true });
  }
})();
</script>
</body>
</html>
